name: Android APK

# Gera o APK de debug na nuvem — sem precisar de Java/Android SDK na sua máquina.
# Rode manualmente em Actions > "Android APK" > "Run workflow", ou deixe disparar
# quando algo NATIVO mudar (config do Capacitor, pasta android/, deps).
#
# Lembre: mudança só de código JS/UI NÃO precisa de APK novo — ela chega ao
# celular quando você publica a nova versão na Vercel. O APK só muda quando muda
# algo nativo (permissões, plugins, ícone, versionCode) ou a APP_PUBLIC_URL.
#
# Pré-requisitos (uma vez), em Settings do repositório:
#   Secrets:   VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY, VITE_SUPABASE_PROJECT_ID
#   Variables: APP_PUBLIC_URL  (ex.: https://seu-app.vercel.app — a URL da Vercel)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "capacitor.config.ts"
      - "android/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # O runner ubuntu-latest já vem com o Android SDK (ANDROID_HOME). O passo
      # android-actions/setup-android@v3 passou a falhar ("Failed to find package
      # 'tools'" no sdkmanager) antes de compilar qualquer coisa, então só aceitamos as
      # licenças do SDK existente; o Gradle baixa plataforma/build-tools sob demanda.
      - name: Accept Android SDK licenses
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Build web + sync Capacitor
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          APP_PUBLIC_URL: ${{ vars.APP_PUBLIC_URL }}
        run: |
          npm run build
          node scripts/sync-android-assets.mjs
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: forja-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Forja — Offline</title>
    <link rel="icon" href="/favicon.png" type="image/png" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #050505;
        color: #fafafa;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        text-align: center;
        padding: 24px;
      }
      h1 {
        font-size: 20px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin: 0 0 8px;
      }
      p {
        color: #a1a1aa;
        font-size: 14px;
        line-height: 1.5;
        max-width: 320px;
        margin: 0 auto;
      }
      button {
        margin-top: 24px;
        padding: 12px 20px;
        border: 0;
        border-radius: 12px;
        background: #22c55e;
        color: #000;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>📡 Forja offline</h1>
      <p>
        Esta tela ainda não foi salva no aparelho. Abra uma vez com internet e ela ficará disponível
        offline. Seus dados locais continuam guardados.
      </p>
      <button onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>

name: Generate debug keystore (one-off)

# Workflow temporário: gera um keystore de debug com senha/alias padrão do Android
# ("android"/"androiddebugkey" — convenção pública, não é segredo) e disponibiliza
# como artifact. Rodar uma vez, baixar o artifact, commitar android/app/debug.keystore
# no repo, apontar o signingConfig "debug" pra ele, e então apagar este arquivo.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
      - uses: actions/upload-artifact@v4
        with:
          name: debug-keystore
          path: debug.keystore

<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Forja — Offline</title>
    <link rel="icon" href="/favicon.png" type="image/png" />
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #050505;
        color: #fafafa;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        padding: 20px 16px 40px;
      }
      header {
        text-align: center;
        margin-bottom: 20px;
      }
      header h1 {
        font-size: 18px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin: 0 0 6px;
      }
      header p {
        color: #a1a1aa;
        font-size: 13px;
        margin: 0;
      }
      button {
        display: block;
        margin: 18px auto 0;
        padding: 12px 20px;
        border: 0;
        border-radius: 12px;
        background: #22c55e;
        color: #000;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-size: 12px;
      }
      ul {
        list-style: none;
        margin: 0 auto;
        padding: 0;
        max-width: 480px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      li {
        display: flex;
        align-items: center;
        gap: 12px;
        background: #111113;
        border: 1px solid #232326;
        border-radius: 14px;
        padding: 12px 14px;
      }
      li.done {
        opacity: 0.5;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: #22c55e;
        flex-shrink: 0;
      }
      li.done .dot {
        background: #52525b;
      }
      .info {
        min-width: 0;
      }
      .info .name {
        font-size: 14px;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .info .time {
        font-size: 12px;
        color: #a1a1aa;
      }
      .empty {
        text-align: center;
        color: #a1a1aa;
        font-size: 14px;
        max-width: 320px;
        margin: 40px auto 0;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>📡 Forja offline</h1>
      <p>Sem internet agora — mostrando o que já está salvo no aparelho.</p>
    </header>
    <div id="root"></div>
    <button onclick="location.reload()">Tentar reconectar</button>
    <script>
      (function () {
        // Tenta primeiro devolver o APP DE VERDADE (com todas as funções) a partir do
        // cache que o service worker já guardou (public/sw.js, cache "forja-html-v1").
        // Só cai na lista simples abaixo se não achar nada cacheado ainda.
        async function tryRestoreRealApp() {
          if (!("caches" in window)) return false;
          try {
            var cache = await caches.open("forja-html-v1");
            var cached = (await cache.match(location.href)) || (await cache.match("/"));
            if (!cached) return false;
            var html = await cached.text();
            document.open();
            document.write(html);
            document.close();
            return true;
          } catch (e) {
            return false;
          }
        }

        function render() {
          var root = document.getElementById("root");
          var raw = null;
          try {
            raw = localStorage.getItem("kairos-store-v1");
          } catch (e) {
            // storage bloqueado (ex.: modo privado) — segue com vazio
          }
          var tasks = [];
          var completedToday = [];
          try {
            var parsed = raw ? JSON.parse(raw) : null;
            var state = parsed && parsed.state ? parsed.state : null;
            tasks = (state && state.tasks) || [];
            completedToday = (state && state.completedToday) || [];
          } catch (e) {
            /* dado corrompido/ausente — segue com vazio */
          }

          var active = tasks
            .filter(function (t) {
              return !t.archived && t.status !== "cancelada";
            })
            .sort(function (a, b) {
              return (a.time || "").localeCompare(b.time || "");
            });

          if (!active.length) {
            root.innerHTML =
              '<p class="empty">Nenhuma tarefa salva no aparelho ainda. Abra o app com internet' +
              " ao menos uma vez para elas aparecerem aqui offline.</p>";
            return;
          }

          var html = "<ul>";
          active.forEach(function (t) {
            var done = completedToday.indexOf(t.id) !== -1;
            html +=
              '<li class="' +
              (done ? "done" : "") +
              '"><span class="dot"></span><span class="info">' +
              '<div class="name">' +
              escapeHtml(t.name || "Tarefa") +
              "</div>" +
              '<div class="time">' +
              escapeHtml(t.time || "") +
              "</div></span></li>";
          });
          html += "</ul>";
          root.innerHTML = html;
        }

        function escapeHtml(s) {
          return String(s).replace(/[&<>"']/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
          });
        }

        tryRestoreRealApp().then(function (restored) {
          if (!restored) render();
        });
      })();
    </script>
  </body>
</html>
